<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Dayflow HRMS</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; background-color: var(--bg-main);">

    <div style="width: 100%; max-width: 400px;">
        <div class="card" style="padding: 24px; border-radius: var(--radius-md); box-shadow: var(--shadow-md);">
            
            <div style="text-align: center; margin-bottom: 20px;">
                <div class="brand-icon" style="margin: 0 auto 12px auto; width: 44px; height: 44px; font-size: 1.3rem;">D</div>
                <h1 style="font-size: 1.5rem; margin-bottom: 4px;">Dayflow HRMS</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Sign in to access your account</p>
            </div>

            <div id="error-msg" style="color: #8B2020; background: #FBEBEB; border: 1px solid #F0B8B8; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.8rem; margin-bottom: 12px; display: none;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" required placeholder="name@company.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 9px;">
                    Sign In to Dashboard
                </button>
            </form>

            <div style="margin-top: 20px; padding-top: 14px; border-top: 1px dashed var(--border-main); text-align: center;">
                <p style="font-size: 0.775rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase;">Quick Demo Login</p>
                <div style="display: flex; gap: 8px;">
                    <button type="button" onclick="fillCredentials('hr@company.com', 'admin123')" class="btn btn-secondary btn-sm" style="flex: 1;">
                        Fill Admin HR
                    </button>
                    <button type="button" onclick="fillCredentials('employee@company.com', 'emp123')" class="btn btn-secondary btn-sm" style="flex: 1;">
                        Fill Employee
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function fillCredentials(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error-msg');
            errorDiv.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    errorDiv.textContent = data.detail || 'Login failed. Please check your credentials.';
                    errorDiv.style.display = 'block';
                    return;
                }

                document.cookie = `access_token=Bearer ${data.access_token}; path=/; max-age=86400`;
                localStorage.setItem('token', data.access_token);
                const landing = data.role === 'admin_hr' ? '/admin-dashboard' : '/dashboard';
                window.location.href = landing;
            } catch (err) {
                errorDiv.textContent = 'Server error. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
